<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Vote Teaser</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@500;700;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#1a0808;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
  font-family:'Montserrat',sans-serif;
}

.story{
  width:390px;
  height:844px;
  position:relative;
  overflow:hidden;
  background:#fdf6f0;
  border-radius:20px;
}

.bg-pattern{
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(180,30,30,0.07) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 100%, rgba(180,30,30,0.05) 0%, transparent 60%),
    #fdf6f0;
}

.bg-dots{
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle, rgba(180,30,30,0.07) 1px, transparent 1px);
  background-size:20px 20px;
}

/* TOP */

.top-section{
  position:relative;
  z-index:10;
  padding:40px 28px 14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:9px;
}

.alert-badge{
  display:flex;
  align-items:center;
  gap:7px;
  background:#c0392b;
  color:#fff;
  font-size:10px;
  font-weight:900;
  letter-spacing:2.5px;
  text-transform:uppercase;
  padding:6px 16px;
  border-radius:20px;
  animation:badgePop 2s ease-in-out infinite;
}

@keyframes badgePop{
  0%,100%{
    box-shadow:0 0 0 0 rgba(192,57,43,0.4);
  }
  50%{
    box-shadow:0 0 0 8px rgba(192,57,43,0);
  }
}

.alert-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#fff;
  animation:blink 1s step-end infinite;
}

@keyframes blink{
  50%{
    opacity:0;
  }
}

.main-title{
  font-family:'Playfair Display',serif;
  font-size:30px;
  font-weight:700;
  font-style:italic;
  color:#7a2020;
  text-align:center;
  line-height:1.15;
  letter-spacing:1px;
}

.class-title{
  font-family:'Playfair Display',serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:3.5px;
  color:#7a2020;
  text-transform:uppercase;
  text-align:center;
}

.ornament-top,
.ornament-mid{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
}

.orn-line{
  flex:1;
  height:1px;
  background:
    linear-gradient(
      90deg,
      transparent,
      #c0392b,
      transparent
    );
}

.orn-diamond{
  width:7px;
  height:7px;
  background:#c0392b;
  transform:rotate(45deg);
}

/* CERT */

.cert-wrapper{
  position:relative;
  z-index:10;
  margin:6px 20px 0;
}

.cert-outer{
  border:2.5px solid #c0392b;
  padding:12px;
  position:relative;
  background:#fff9f6;
}

.corner{
  position:absolute;
  width:14px;
  height:14px;
}

.corner::before,
.corner::after{
  content:'';
  position:absolute;
  background:#c0392b;
}

.corner::before{
  width:100%;
  height:2px;
  top:0;
  left:0;
}

.corner::after{
  width:2px;
  height:100%;
  top:0;
  left:0;
}

.c-tl{
  top:-2px;
  left:-2px;
}

.c-tr{
  top:-2px;
  right:-2px;
  transform:scaleX(-1);
}

.c-bl{
  bottom:-2px;
  left:-2px;
  transform:scaleY(-1);
}

.c-br{
  bottom:-2px;
  right:-2px;
  transform:scale(-1,-1);
}

.cert-inner{
  border:1px solid rgba(192,57,43,0.30);
  padding:14px 18px 16px;
  min-height:440px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.cert-header{
  font-family:'Playfair Display',serif;
  font-size:19px;
  font-weight:700;
  letter-spacing:3px;
  color:#7a2020;
  text-align:center;
  margin-top:18px;
}

.cert-line{
  width:78%;
  height:1px;
  background:rgba(192,57,43,0.28);
  margin:8px auto;
}

.small-line{
  width:55%;
  margin:0;
}

.bottom-line{
  margin-top:auto;
}

.cert-intro{
  font-size:10px;
  color:rgba(122,32,32,0.65);
  font-style:italic;
  margin-bottom:4px;
}

/* BLUR */

.blurred-name-zone{
  position:relative;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding:10px 0 14px;
}

.title-blur{
  font-size:10px;
  font-weight:800;
  letter-spacing:4px;
  color:#7a2020;
  filter:blur(5px);
  opacity:0.7;
  text-transform:uppercase;
}

.name-blur{
  font-family:'Dancing Script',cursive;
  font-size:44px;
  color:#7a2020;
  filter:blur(7px);
  letter-spacing:6px;
  opacity:0.72;
}

.reason-blur-block{
  width:82%;
  display:flex;
  flex-direction:column;
  gap:7px;
  align-items:center;
}

.reason-line{
  height:7px;
  border-radius:4px;
  background:rgba(122,32,32,0.16);
  filter:blur(3px);
}

.reason-line.w100{
  width:100%;
}

.reason-line.w70{
  width:70%;
}

.lock-badge{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,249,246,0.88);
  backdrop-filter:blur(6px);
  border:1.5px solid rgba(192,57,43,0.25);
  border-radius:50%;
  width:50px;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  box-shadow:0 4px 18px rgba(192,57,43,0.12);
  animation:lockFloat 3s ease-in-out infinite;
}

@keyframes lockFloat{
  0%,100%{
    transform:translate(-50%,-50%) scale(1);
  }
  50%{
    transform:translate(-50%,-56%) scale(1.06);
  }
}

.cert-bottom{
  width:100%;
  display:flex;
  justify-content:flex-end;
  align-items:flex-end;
  gap:10px;
  padding:0 4px;
}

.council-text{
  font-size:7.5px;
  font-weight:800;
  letter-spacing:1.5px;
  color:rgba(122,32,32,0.45);
  text-align:right;
  text-transform:uppercase;
  line-height:1.6;
}

.stamp-wrap{
  width:72px;
  height:72px;
  transform:rotate(-10deg);
}

/* BOTTOM */

.bottom-section{
  position:relative;
  z-index:10;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  padding:14px 24px 34px;
}

.teaser-line{
  font-family:'Dancing Script',cursive;
  font-size:16px;
  color:rgba(122,32,32,0.72);
  text-align:center;
  line-height:1.6;
}

.teaser-line span{
  font-size:14px;
  opacity:0.7;
}

.countdown-box{
  background:
    linear-gradient(
      135deg,
      #c0392b 0%,
      #8e1a0e 100%
    );

  border-radius:14px;
  padding:16px 24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  width:100%;
  box-shadow:0 8px 28px rgba(192,57,43,0.32);
}

.countdown-label{
  font-size:9.5px;
  font-weight:700;
  letter-spacing:3px;
  color:rgba(255,255,255,0.65);
  text-transform:uppercase;
}

.countdown-time{
  display:flex;
  align-items:center;
  gap:2px;
}

.cd-block{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
}

.cd-num{
  font-family:'Playfair Display',serif;
  font-size:46px;
  font-weight:700;
  color:#fff;
  line-height:1;
  min-width:62px;
  text-align:center;
}

.cd-unit{
  font-size:7.5px;
  font-weight:700;
  letter-spacing:2.5px;
  color:rgba(255,255,255,0.55);
  text-transform:uppercase;
}

.cd-sep{
  font-family:'Playfair Display',serif;
  font-size:42px;
  color:rgba(255,255,255,0.45);
  margin-bottom:14px;
}

.midnight-tag{
  background:rgba(255,255,255,0.13);
  border-radius:20px;
  padding:5px 14px;
}

.midnight-tag span{
  font-size:10px;
  font-weight:700;
  color:rgba(255,255,255,0.88);
  letter-spacing:1.5px;
}

.bottom-orn{
  display:flex;
  align-items:center;
  gap:8px;
}

.short{
  width:28px;
  flex:none;
}

.bottom-orn-text{
  font-size:9px;
  color:rgba(122,32,32,0.45);
  letter-spacing:4px;
  text-transform:uppercase;
  font-weight:700;
}

/* MOBILE */

@media(max-width:450px){

  body{
    padding:0;
  }

  .story{
    width:100vw;
    height:100vh;
    border-radius:0;
  }

}
</style>
</head>

<body>

<div class="story">

  <div class="bg-pattern"></div>
  <div class="bg-dots"></div>

  <!-- TOP -->
  <div class="top-section">

    <div class="alert-badge">
      <div class="alert-dot"></div>
      SẮP MỞ BÌNH CHỌN
    </div>

    <div class="main-title">
      A1's <br>
      Voting
    </div>

    <div class="class-title">
      11A1 · THPT NK 24'27
    </div>

    <div class="ornament-top">
      <div class="orn-line"></div>
      <div class="orn-diamond"></div>
      <div class="orn-line"></div>
    </div>

  </div>

  <!-- CERTIFICATE -->
  <div class="cert-wrapper">

    <div class="cert-outer">

      <div class="corner c-tl"></div>
      <div class="corner c-tr"></div>
      <div class="corner c-bl"></div>
      <div class="corner c-br"></div>

      <div class="cert-inner">

        <div class="cert-header">
          GIẤY CHỨNG NHẬN
        </div>

        <div class="cert-line"></div>

        <div class="cert-intro">
          Xin chúc mừng chủ nhân của danh hiệu:
        </div>

        <div class="blurred-name-zone">

          <div class="title-blur">
            ✦ ░░░░░░░░░░░░ ✦
          </div>

          <div class="name-blur">
            ꫀ ༄ ℘ ꩜ ✦
          </div>

          <div class="cert-line small-line"></div>

          <div class="reason-blur-block">
            <div class="reason-line w100"></div>
            <div class="reason-line w70"></div>
          </div>

          <div class="lock-badge">
            🔒
          </div>

        </div>

        <div class="cert-line bottom-line"></div>

        <div class="cert-bottom">

          <div class="council-text">
            Hội Đồng <br>
            Trao Giải
          </div>

          <div class="stamp-wrap">

            <svg viewBox="0 0 100 100" fill="none">

              <circle cx="50" cy="50" r="28"
                stroke="#c0392b"
                stroke-width="1.3"
                opacity="0.7"/>

              <ellipse cx="50" cy="50"
                rx="28"
                ry="7"
                stroke="#c0392b"
                stroke-width="1"
                opacity="0.55"/>

              <ellipse cx="50" cy="38"
                rx="22"
                ry="5.5"
                stroke="#c0392b"
                stroke-width="0.8"
                opacity="0.45"/>

              <ellipse cx="50" cy="62"
                rx="22"
                ry="5.5"
                stroke="#c0392b"
                stroke-width="0.8"
                opacity="0.45"/>

              <ellipse cx="50" cy="50"
                rx="10"
                ry="28"
                stroke="#c0392b"
                stroke-width="0.9"
                opacity="0.5"/>

              <line x1="50" y1="22"
                x2="50" y2="78"
                stroke="#c0392b"
                stroke-width="0.9"
                opacity="0.5"/>

              <ellipse cx="50" cy="54"
                rx="40"
                ry="12"
                stroke="#c0392b"
                stroke-width="2"/>

              <text
                x="50"
                y="54"
                text-anchor="middle"
                dominant-baseline="middle"
                font-size="13"
                font-weight="900"
                fill="#c0392b"
                style="font-style:italic">

                11A1

              </text>

            </svg>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- BOTTOM -->
  <div class="bottom-section">

    <div class="ornament-mid">
      <div class="orn-line"></div>
      <div class="orn-diamond"></div>
      <div class="orn-line"></div>
    </div>

    <div class="teaser-line">
      ✨ Ai sẽ nhận được giấy chứng nhận? ✨
      <br>
      <span>Mở bình chọn lúc nửa đêm nay...</span>
    </div>

    <div class="countdown-box">

      <div class="countdown-label">
        ⏳ Đếm ngược mở vote
      </div>

      <div class="countdown-time">

        <div class="cd-block">
          <div class="cd-num" id="hh">00</div>
          <div class="cd-unit">Giờ</div>
        </div>

        <div class="cd-sep">:</div>

        <div class="cd-block">
          <div class="cd-num" id="mm">00</div>
          <div class="cd-unit">Phút</div>
        </div>

        <div class="cd-sep">:</div>

        <div class="cd-block">
          <div class="cd-num" id="ss">00</div>
          <div class="cd-unit">Giây</div>
        </div>

      </div>

      <div class="midnight-tag">
        <span>🌙 12:00 AM · ĐÊM NAY</span>
      </div>

    </div>

    <div class="bottom-orn">
      <div class="orn-line short"></div>
      <div class="bottom-orn-text">
        Stay tuned
      </div>
      <div class="orn-line short"></div>
    </div>

  </div>

</div>

<script>
function pad(n){
  return String(n).padStart(2,'0');
}

function tick(){

  const now = new Date();

  const midnight = new Date();

  midnight.setHours(24,0,0,0);

  const diff = Math.max(0, midnight - now);

  document.getElementById('hh').textContent =
    pad(Math.floor(diff / 3600000));

  document.getElementById('mm').textContent =
    pad(Math.floor((diff % 3600000) / 60000));

  document.getElementById('ss').textContent =
    pad(Math.floor((diff % 60000) / 1000));
}

tick();

setInterval(tick,1000);
</script>

</body>
</html>
